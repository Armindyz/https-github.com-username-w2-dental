<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<title>W2 Dental — 3D Logo</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #2a3a55 0%, #0a0e1a 70%, #05060c 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
  }
  canvas { display: block; }
  #hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    color: #bcd; opacity: 0.7; font-size: 12px; letter-spacing: 0.5px;
    pointer-events: none; user-select: none;
  }
  #title {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    color: #d8e3f3; opacity: 0.85; font-size: 14px; letter-spacing: 4px;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="title">W2 DENTAL</div>
<div id="hint">ลากเพื่อหมุน • Scroll เพื่อซูม • คลิกขวาเพื่อเลื่อน</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }     from 'three/addons/controls/OrbitControls.js';
import { FontLoader }        from 'three/addons/loaders/FontLoader.js';
import { TextGeometry }      from 'three/addons/geometries/TextGeometry.js';
import { RoomEnvironment }   from 'three/addons/environments/RoomEnvironment.js';

/* --- scene / renderer / camera --- */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  32, window.innerWidth / window.innerHeight, 0.1, 100
);
camera.position.set(0, 0.2, 7.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

/* --- environment for chrome reflections --- */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* --- silver / chrome material --- */
const silver = new THREE.MeshStandardMaterial({
  color:       0xe8e8ea,
  metalness:   1.0,
  roughness:   0.18,
  envMapIntensity: 1.3
});

/* --- build the tooth outline shape --- */
function createToothShape(scale = 1) {
  const k = scale;
  const s = new THREE.Shape();
  // start at the valley between the two cusps (top center)
  s.moveTo(0, 1.0 * k);
  // right cusp
  s.bezierCurveTo( 0.10 * k, 1.45 * k,  0.65 * k, 1.55 * k,  1.00 * k, 1.30 * k);
  // right shoulder coming down
  s.bezierCurveTo( 1.35 * k, 1.00 * k,  1.40 * k, 0.40 * k,  1.20 * k,-0.10 * k);
  // right root tapering toward bottom
  s.bezierCurveTo( 1.05 * k,-0.70 * k,  0.60 * k,-1.18 * k,  0.25 * k,-1.28 * k);
  // bottom edge
  s.lineTo(-0.25 * k, -1.28 * k);
  // left root rising up
  s.bezierCurveTo(-0.60 * k,-1.18 * k, -1.05 * k,-0.70 * k, -1.20 * k,-0.10 * k);
  s.bezierCurveTo(-1.40 * k, 0.40 * k, -1.35 * k, 1.00 * k, -1.00 * k, 1.30 * k);
  // left cusp closing back to start
  s.bezierCurveTo(-0.65 * k, 1.55 * k, -0.10 * k, 1.45 * k,  0,        1.00 * k);
  return s;
}

/* outer ring of tooth (with inner hole to make it look like an outline) */
const outer = createToothShape(1.00);
const innerShape = createToothShape(0.88);
const innerPts   = innerShape.getPoints(96).reverse(); // reverse winding for hole
const hole = new THREE.Path();
hole.moveTo(innerPts[0].x, innerPts[0].y);
for (let i = 1; i < innerPts.length; i++) hole.lineTo(innerPts[i].x, innerPts[i].y);
outer.holes.push(hole);

const toothGeom = new THREE.ExtrudeGeometry(outer, {
  depth: 0.28,
  bevelEnabled:    true,
  bevelThickness:  0.05,
  bevelSize:       0.05,
  bevelOffset:     0,
  bevelSegments:   8,
  curveSegments:   96
});
toothGeom.center();

const toothMesh = new THREE.Mesh(toothGeom, silver);

/* a group lets us spin the whole logo together */
const logo = new THREE.Group();
logo.add(toothMesh);
scene.add(logo);

/* --- W2 lettering, loaded as 3D text --- */
const fontLoader = new FontLoader();
fontLoader.load(
  'https://unpkg.com/three@0.160.0/examples/fonts/optimer_bold.typeface.json',
  (font) => {
    const textGeo = new TextGeometry('W2', {
      font:           font,
      size:           0.95,
      height:         0.30,
      curveSegments:  16,
      bevelEnabled:   true,
      bevelThickness: 0.05,
      bevelSize:      0.04,
      bevelOffset:    0,
      bevelSegments:  6
    });
    textGeo.center();
    const text = new THREE.Mesh(textGeo, silver);
    text.position.z = 0.18;       // pop out from the tooth a touch
    text.position.y = -0.02;
    logo.add(text);
  },
  undefined,
  (err) => {
    console.warn('Font failed to load, showing tooth only.', err);
  }
);

/* --- lighting (the environment map does most of the reflective work,
       these add highlights and a touch of color) --- */
const key  = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set( 5, 6, 6);
scene.add(key);

const fill = new THREE.DirectionalLight(0x88aaff, 0.7);
fill.position.set(-6, -2, 3);
scene.add(fill);

const rim  = new THREE.DirectionalLight(0xffd2a0, 0.6);
rim.position.set(0, -5, -6);
scene.add(rim);

scene.add(new THREE.AmbientLight(0xffffff, 0.25));

/* --- controls --- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping  = true;
controls.dampingFactor  = 0.06;
controls.autoRotate     = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 4;
controls.maxDistance = 14;

/* --- resize --- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* --- pause auto-rotate while the user is interacting --- */
let userInteracting = false;
renderer.domElement.addEventListener('pointerdown', () => {
  userInteracting = true;
  controls.autoRotate = false;
});
renderer.domElement.addEventListener('pointerup', () => {
  userInteracting = false;
  setTimeout(() => { if (!userInteracting) controls.autoRotate = true; }, 2500);
});

/* --- render loop --- */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
